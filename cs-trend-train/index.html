<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cs-trend-train · 手动趋势画线交易训练</title>
<script src="klinecharts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: #16181d; color: #d8dce3; }
  #top { display: flex; gap: 8px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
  #top input, #top button, #top select { background: #23262e; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 8px; font-size: 13px; }
  #top button { cursor: pointer; }
  #top button:hover { background: #2e323c; }
  #symList { position: absolute; z-index: 99; background: #23262e; border: 1px solid #3a3f4b;
      border-radius: 4px; max-height: 240px; overflow-y: auto; min-width: 220px; }
  #symList div { padding: 5px 10px; cursor: pointer; }
  #symList div:hover { background: #2e323c; }
  .grp { display: flex; gap: 6px; align-items: center; padding: 2px 10px 2px 0; }
  .grp b { color: #9aa3b2; font-weight: 600; }
  #chart { width: 100%; height: calc(100vh - 96px); position: relative; }
  .drawer { position: absolute; right: 84px; z-index: 50; width: 250px; display: none;
      background: rgba(35,38,46,.96); border: 1px solid #3a3f4b; border-radius: 6px; padding: 10px; }
  /* ★ right 从 12px 挪到 84px：原来的位置会压住右侧价格标尺，输入止损/止盈时看不见价格。
     现在默认让开标尺，而且所有浮窗都能拖（拖标题栏） */
  .drawer h4, #macroWin .mhead { cursor: move; }
  #macroWin { position: absolute; left: 40px; top: 88px; z-index: 55; width: 580px; display: none;
      background: rgba(28,31,38,.97); border: 1px solid #3a3f4b; border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #macroWin .mhead { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      border-bottom: 1px solid #2a2e38; }
  #macroWin .mhead b { font-size: 13px; color: #9aa3b2; }
  #macroWin .mhead .x { margin-left: auto; cursor: pointer; color: #7a8494; }
  #mIdx { width: 190px; background: #23262e; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 3px 8px; font-size: 13px; }
  #mIdxPop { position: absolute; z-index: 70; display: none; left: 0; top: 100%; min-width: 190px;
      max-height: 200px; overflow-y: auto; background: #23262e; border: 1px solid #3a3f4b;
      border-radius: 4px; }
  #mIdxPop div { padding: 5px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  #mIdxPop div:hover { background: #2e323c; }
  #macroChart { height: 300px; }
  #mHint { padding: 6px 10px 9px; font-size: 11px; color: #9aa3b2; line-height: 1.6; }
  #mHint b { color: #d8dce3; }
  #mHint .bull { color: #ef232a; } #mHint .bear { color: #14b143; }
  #panel { top: 52px; }
  #setPanel { top: 52px; }
  #notePanel { top: 52px; }
  .drawer textarea { width: 100%; background: #1b1e24; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 6px; font: inherit; resize: vertical; }
  #nSymPop { position: absolute; z-index: 60; display: none; left: 0; right: 0; max-height: 200px;
      overflow-y: auto; background: #23262e; border: 1px solid #3a3f4b; border-radius: 4px; }
  #nSymPop div { padding: 5px 10px; cursor: pointer; font-size: 12px; }
  #nSymPop div:hover { background: #2e323c; }
  #nDates { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #nDates span { background: #2a2e38; border: 1px solid #3a3f4b; border-radius: 3px;
      padding: 1px 6px; font-size: 11px; color: #9aa3b2; cursor: pointer; }
  #nDates span:hover { color: #d8dce3; border-color: #4a5060; }
  .drawer h4 { font-size: 13px; color: #9aa3b2; margin-bottom: 8px; display: flex;
      justify-content: space-between; align-items: center; }
  .drawer h4 span { cursor: pointer; color: #7a8494; font-weight: 400; }
  .drawer label.f { display: block; font-size: 11px; color: #9aa3b2; margin: 6px 0 2px; }
  .drawer input { width: 100%; background: #1b1e24; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 6px; }
  .drawer button { width: 100%; background: #2b5fad; color: #fff; border: 0; border-radius: 4px;
      padding: 6px; cursor: pointer; margin-top: 8px; }
  .drawer button:hover { background: #3571c4; }
  .drawer button.alt { background: #3a3f4b; margin-top: 4px; }
  .drawer button.alt:hover { background: #4a5060; }
  .drawer button.danger { background: #8c3a3a; margin-top: 10px; }
  .drawer button.danger:hover { background: #a54444; }
  .drawer button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: #7a8494; margin-top: 8px; line-height: 1.45; }
  #tPrev { font-size: 11px; margin-top: 8px; padding: 6px; border-radius: 4px;
      background: #1b1e24; color: #9aa3b2; min-height: 30px; line-height: 1.45; }
  #tPrev.err { background: #3a2020; color: #e88; }
  #tPrev.warn { background: #3a3320; color: #e8c35a; }
  #tPrev b { color: #d8dce3; }
  label.ck { display: flex; gap: 6px; align-items: center; cursor: pointer; margin: 6px 0; }
  label.ck input { width: auto; }
  #msg { position: absolute; left: 50%; transform: translateX(-50%); top: 48px; z-index: 60;
      background: #2e5c2e; padding: 6px 16px; border-radius: 4px; display: none; }
  /* ── 开仓评分：面板内的分数框 + 二级评分弹窗 ── */
  #tScore { background: #1b1e24; border: 1px solid #3a3f4b; border-radius: 4px; padding: 6px 8px;
      cursor: pointer; line-height: 1.5; font-size: 12px; }
  #tScore:hover { border-color: #4a5060; }
  #tScore.ok { border-color: #2e5c2e; }
  #tScore.low { border-color: #8c3a3a; }
  #tScore .sc-total { font-size: 16px; font-weight: 600; margin-right: 6px; }
  #tScore.low .sc-total { color: #e86a6a; }
  #tScore.ok .sc-total { color: #4cc47a; }
  #tScore .sc-hint { color: #7a8494; }
  /* ★ 2026-10-08：评分窗从「全屏遮罩 + 居中」改成**非模态浮窗** —— 原来一弹出就盖住整张 K 线，
     打分时看不到图（评分项全靠看图判断）。现在停在左上角、没有遮罩层，拖标题栏即可挪开；
     也不挡右侧的「提交交易」面板，可以边看 K 线边打分。 */
  .smodal { position: fixed; left: 40px; top: 88px; display: none; z-index: 80; }
  .smodal.on { display: block; }
  .sbox { background: rgba(27,30,36,.97); border: 1px solid #3a3f4b; border-radius: 8px; padding: 14px;
      width: 430px; max-height: calc(100vh - 110px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .sbox h4 { font-size: 13px; color: #9aa3b2; display: flex; justify-content: space-between;
      margin-bottom: 8px; cursor: move; }
  .sbox h4 span:last-child { cursor: pointer; }
  .sg-head { font-size: 11px; color: #7a8494; margin: 10px 0 3px; }
  .sg-head:first-child { margin-top: 0; }
  .sopt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px;
      cursor: pointer; font-size: 12px; }
  .sopt:hover { background: #23262e; }
  .sopt input { accent-color: #2b5fad; }
  .sitem { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .sitem label { flex: 1; cursor: default; }
  .sitem input[type=range] { width: 128px; accent-color: #2b5fad; }
  .sitem .sv { width: 24px; text-align: right; font-weight: 600; }
  .sfoot { display: flex; align-items: center; gap: 10px; margin-top: 14px;
      border-top: 1px solid #2a2e38; padding-top: 10px; }
  .sfoot .stotal { font-size: 20px; font-weight: 700; }
  .sfoot .stotal small { font-size: 11px; color: #7a8494; font-weight: 400; }
  .sfoot .sbtns { margin-left: auto; display: flex; gap: 8px; }
  .sfoot button { background: #2b5fad; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 16px; cursor: pointer; }
  .sfoot button:hover { background: #3571c4; }
  .sfoot button.alt { background: #3a3f4b; }
  .sfoot button.alt:hover { background: #4a5060; }
</style>
</head>
<body>
<div id="top">
  <div style="position:relative">
    <input id="sym" placeholder="代码/名称/拼音首字母" style="width:170px" value="601318.SH 中国平安">
    <div id="symList" style="display:none"></div>
  </div>
  <!-- ★ 2026-10-09：默认训练窗口 = 2020 全年（起 2020-01-01 / 止 2020-12-31）。
       ▶ 可越过「止」继续揭示到库内最后一根 —— 想练更晚的行情就一路按 ▶ 或手改「止」。 -->
  <div class="grp"><b>起</b><input id="d0" type="date" value="2020-01-01"></div>
  <div class="grp"><b>止</b><input id="d1" type="date" value="2020-12-31"></div>
  <button id="load">加载</button>
  <div class="grp" style="margin-left:12px">
    <button class="pb" data-n="-10">◀10</button><button class="pb" data-n="-1">◀1</button>
    <button class="pb" data-n="1">▶1</button><button class="pb" data-n="10">▶10</button>
  </div>
  <button id="draw">✏ 画趋势线</button>
  <button id="openTrade">📥 提交交易</button>
  <button id="openNote">📝 交易心得</button>
  <button id="openStats">📊 交易统计</button>
  <button id="openMacro">📈 宏观行情</button>
  <button id="openSet">⚙ 设置</button>
  <span id="status" style="color:#7a8494"></span>
</div>
<div id="chart"></div>

<!-- 宏观行情：指数 close 曲线 + MA200，判牛熊 -->
<div id="macroWin">
  <div class="mhead" id="macroHead">
    <b>宏观行情</b>
    <div style="position:relative">
      <input id="mIdx" autocomplete="off" placeholder="选指数">
      <div id="mIdxPop"></div>
    </div>
    <span class="x" id="mClose">✕</span>
  </div>
  <div id="macroChart"></div>
  <div id="mHint">—</div>
</div>

<!-- 提交交易面板：按钮开合；保存成功后按钮变「修改」 -->
<div id="panel" class="drawer">
  <h4><span id="tTitle">提交交易</span><span id="tClose">✕</span></h4>
  <label class="f">方向（做空 = 跌赚钱、涨赔钱）</label>
  <label class="f" style="display:flex;gap:14px;align-items:center;font-weight:400">
    <label><input type="radio" name="tDir" value="long" checked> 做多</label>
    <label><input type="radio" name="tDir" value="short"> 做空</label>
  </label>
  <label class="f">开仓时间 *</label>
  <input id="tDate" type="date">
  <label class="f">开仓价（留空 = 该日开盘价）</label>
  <input id="tBuy" type="number" step="0.01" placeholder="留空 = 当日开盘价">
  <label class="f">止损价 *</label>
  <input id="tStop" type="number" step="0.01" placeholder="必填（须低于开仓价）">
  <label class="f">止盈价 *</label>
  <input id="tTp" type="number" step="0.01" placeholder="必填（须高于开仓价）">
  <label class="f">开仓评分 *（理由 60 分 + 其余各项各 0-10，≥60 即可保存）</label>
  <div id="tScore">—</div>
  <div id="tPrev">—</div>
  <button id="tSave">保存</button>
  <button id="tNew" class="alt">＋ 新建一笔</button>
  <div class="hint">出场只认你提交的止损/止盈价：从开仓日当根逐日判定，同日双触按止损计，
    跳空越过触发价按当日开盘价成交。<b>做空时方向反过来</b>：止损价须<b>高于</b>开仓价、
    止盈价须<b>低于</b>开仓价，价格<b>跌破止盈</b>才算止盈。</div>
</div>

<!-- 交易心得面板：佐证标的 + 开仓日期 + 标题 + 内容 -->
<div id="notePanel" class="drawer">
  <h4><span id="nTitle">写交易心得</span><span id="nClose">✕</span></h4>
  <label class="f">佐证标的 *</label>
  <div style="position:relative">
    <input id="nSym" placeholder="代码 / 名称 / 拼音首字母" autocomplete="off">
    <div id="nSymPop"></div>
  </div>
  <label class="f">开仓日期 *</label>
  <input id="nDate" type="date">
  <div id="nDates"></div>
  <label class="f">心得标题（可留空）</label>
  <input id="nTitleIn" placeholder="一句话概括">
  <label class="f">心得内容 *</label>
  <textarea id="nContent" rows="6" placeholder="当时怎么想的？错在哪？下次怎么做？"></textarea>
  <button id="nSave">保存</button>
  <button id="nNew" class="alt">＋ 新建一条</button>
  <div class="hint">必填：佐证标的 + 开仓日期 + 内容。已写的心得在「📊 交易统计 → 交易心得」里查看 / 修改 / 删除。</div>
</div>

<!-- 设置面板：显示开关 + 全局止损额度 + 清除当前标的记录 -->
<div id="setPanel" class="drawer">
  <h4><span>设置</span><span id="sClose">✕</span></h4>
  <label class="ck"><input type="checkbox" id="sLines">显示趋势线</label>
  <label class="ck"><input type="checkbox" id="sTrades">显示交易标注</label>
  <label class="f">止损额度（元 · 全局，与标的无关）</label>
  <input id="sRisk" type="number" step="100" min="100">
  <label class="f">初始资金（元 · 仅统计页算 净值/年化 用）</label>
  <input id="sCapital" type="number" step="10000" min="10000">
  <div class="hint">改额度只影响**以后**提交的交易；已提交的仓位是历史事实，不会重算。
    初始资金不影响仓位，只作统计页「净值/年化」的分母。</div>
  <button id="sClear" class="danger">清除当前标的交易记录</button>
  <div class="hint">只清 <b id="sSymName">—</b> 一个标的，不可恢复（会先二次确认）。</div>
</div>
<!-- 开仓评分二级弹窗：按方向弹出做多/做空选项；理由类单选 60 分，其余各项 0-10 分（做多 9 项 / 做空 8 项） -->
<div id="scoreModal" class="smodal">
  <div class="sbox">
    <h4><span id="smTitle">开仓评分</span><span id="smClose">✕</span></h4>
    <div id="smBody"></div>
    <div class="sfoot">
      <span class="stotal"><span id="smTotal">60</span><small> 分</small></span>
      <div class="sbtns">
        <button id="smCancel" class="alt">取消</button>
        <button id="smOk">确定</button>
      </div>
    </div>
  </div>
</div>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
let chart, allBars = [], endIdx = 0, symbol = "601318.SH", symName = "中国平安";
let drawing = false, lineOverlays = [], tradeOverlays = [];
let settings = { risk_amount: 5000, show_lines: true, show_trades: false };
let editingId = null;                     // 非空 = 面板处于「修改」模式
// ⚠ klinecharts 的 removeOverlay() 会**无条件触发 overlay 的 onRemoved 回调** ——
//   而 renderOverlays() 是「先删光再重建」，若不抑制，每次重建都会把刚从服务器
//   读出来的线 DELETE 回去（表现为：一按播放键线就消失，且库里也被清空）。
//   故重建期间置 true，让 onRemoved 区分「程序化重建」与「用户右键删除」。
let suppressRemove = false;

function toast(t, ok=true){ const m=$("#msg"); m.textContent=t;
  m.style.background = ok?"#2e5c2e":"#8c3a3a"; m.style.display="block";
  setTimeout(()=>m.style.display="none", 3000); }
const status = t => $("#status").textContent = t;
const msOf = d => new Date(d+"T00:00:00").getTime();
const fmt = (n,d=2) => (n==null||isNaN(n)) ? "—" : Number(n).toFixed(d);
const wan = n => (n==null||isNaN(n)) ? "—" : (n/10000).toFixed(1)+"万";
// 本地日期格式化（toISOString 是 UTC，东八区会前移一天）
const dOf = ts => { const d=new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
// timestamp → 该 bar 的日期字符串（直接查表，避免任何时区换算）
const tsBar = ts => allBars.find(b => b.timestamp === ts);
// api：非 2xx 时抛出带 status/body 的错误，方便区分 409（同日撞车）做二次确认
async function api(p, o){
  const r = await fetch(p, o), txt = await r.text();
  let j = null; try { j = JSON.parse(txt); } catch(_) {}
  if (!r.ok) throw Object.assign(new Error((j && j.err) || txt || ("HTTP "+r.status)),
                                { status: r.status, body: j });
  return j !== null ? j : txt;
}
const post = (p, body) => api(p, { method:"POST", headers:{"Content-Type":"application/json"},
                                   body: JSON.stringify(body) });

// ── 自定义 overlay：价格处的三角标记（开仓红▲向上 / 平仓绿▼向下）──
//   为什么不直接用内置 simpleAnnotation：它的三角**写死朝下**（是价格上方 50px 处的
//   一个"标注钉"），颜色走全局默认 styles.polygon（蓝）—— 所以 `styles.point.color`
//   与 `styles.text.content` 都没生效过（旧代码的文字标签其实一直没渲染）。
//   ★ 样式优先级：全局默认 → overlay.styles[figure.type] → **figure.styles（最高）**。
//     只写 overlay 级不够：`text` figure 会继承全局的 style:"fill" 把自己画成一个色块，
//     反而把三角盖住（实测是蓝方块）。所以两个 figure 都显式带 figure 级 styles。
klinecharts.registerOverlay({
  name: "triMarker",
  totalStep: 2,
  styles: { polygon: { style:"fill", color:"#ef232a", borderColor:"#ef232a", borderSize:0 },
            text:    { color:"#ef232a", size:11 } },
  createPointFigures: ({ coordinates, overlay }) => {
    const p = coordinates[0]; if (!p) return [];
    const ed = overlay.extendData || {};
    const up = ed.up !== false, S = 8, half = S * 0.72;
    const c = (overlay.styles && overlay.styles.polygon && overlay.styles.polygon.color) || "#ef232a";
    return [
      { type:"polygon", ignoreEvent:true,
        styles:{ style:"fill", color:c, borderColor:c, borderSize:0 },
        attrs:{ coordinates: up
          ? [{x:p.x, y:p.y - S}, {x:p.x - half, y:p.y}, {x:p.x + half, y:p.y}]      // 尖朝上
          : [{x:p.x, y:p.y + S}, {x:p.x - half, y:p.y}, {x:p.x + half, y:p.y}] } }, // 尖朝下
      { type:"text", ignoreEvent:true,
        // 背景/边框全部透明，否则默认会画出一个色块标签
        styles:{ color:c, size:11, style:"fill",
                 backgroundColor:"rgba(0,0,0,0)", borderColor:"rgba(0,0,0,0)", borderSize:0 },
        attrs:{ x:p.x, text: ed.label || "",
                y: up ? p.y - S - 3 : p.y + S + 3, align:"center", baseline: up ? "bottom" : "top" } },
    ];
  }
});

// ── klinecharts v10 初始化 ──
function initChart(){
  chart = klinecharts.init("chart", { styles: {
    candle: {
      bar: { upColor:"#ef232a", downColor:"#14b143", upBorderColor:"#ef232a",
             downBorderColor:"#14b143", upWickColor:"#ef232a", downWickColor:"#14b143" },
      // ③ 在原有那行末尾追加「成交额」「收益率」
      //    title 查不到 locale 键时会**原样输出**，所以可直接写中文
      //    {turnover} / {change} 是 KLineData 标准字段，由后端随每根 bar 下发
      tooltip: { legend: { template: [
        { title:"time",   value:"{time}"   },
        { title:"open",   value:"{open}"   },
        { title:"high",   value:"{high}"   },
        { title:"low",    value:"{low}"    },
        { title:"close",  value:"{close}"  },
        { title:"volume", value:"{volume}" },
        { title:"成交额(亿)：", value:"{turnover}" },
        { title:"收益率：",     value:"{change}" }
      ] } }
    },
    grid: { horizontal:{show:true,color:"#26292f",style:"dashed",dashedValue:[2,3]},
            vertical:{show:true,color:"#26292f",style:"dashed",dashedValue:[2,3]} },
    // VOL 柱颜色与主图蜡烛是**两组独立配置**：蜡烛用 candle.bar，VOL 用 indicator.bars[0]
    // （默认是美股绿涨红跌，必须显式覆盖成 A 股口径）
    indicator: { bars: [{ upColor:"#ef232a", downColor:"#14b143", noChangeColor:"#7a8494" }] },
    crosshair: { horizontal:{text:{backgroundColor:"#3a3f4b"}}, vertical:{text:{backgroundColor:"#3a3f4b"}} },
    overlay: { point:{color:"#e8c35a",borderColor:"#16181d"}, line:{color:"#e8c35a",size:1} }
  }});
  chart.setSymbol({ ticker: symbol, pricePrecision: 2 });
  chart.setPeriod({ span: 1, type: "day" });
  chart.setDataLoader({ getBars: ({callback}) => callback(allBars.slice(0, endIdx)) });
  // ① 成交量附图：calcParams 传空数组 → regenerateFigures 只留 bar，去掉默认的 MA5/10/20 均线
  //    ⚠ createIndicator(indicators, isStack) 只有两个参数 —— 配置必须作为**第一个参数**传对象，
  //      写成 createIndicator("VOL", false, {calcParams:[]}) 会把配置对象当成 isStack 丢掉
  chart.createIndicator({ name: "VOL", calcParams: [] });
  // ② tooltip 字段由下方 styles.candle.tooltip.legend.template 配置（内置，无需自绘）
}

// ── 数据加载 / 播放（6.3：endIdx 相对结束时间移动）──
async function loadSettings(){
  try { settings = await api("/api/settings"); } catch(_) {}
  $("#sLines").checked  = !!settings.show_lines;
  $("#sTrades").checked = !!settings.show_trades;
  $("#sRisk").value = settings.risk_amount;
  $("#sCapital").value = settings.capital ?? 1000000;
}
// 日期合法性：<input type=date> 对非法输入（如 9/31）会**清空为 ""**。
// 空 / 非法一律当「未指定」——否则 d1="" 会让下面的 findIndex 返回 0，
// endIdx 塌成 1，画面上只剩一根 K 线（2026-09-30 用户报的 bug）。
function validYMD(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  if (!m) return false;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(Date.UTC(y, mo - 1, d));      // 非法日期会自动进位，回读校验拦掉
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d;
}
// ★ 2026-10-09：默认训练窗口 = 2020 全年（固定日期，训练场景按年练）。
//   上一版曾把「止」动态跟到库内最后一根 —— 用户改主意要固定 2020-12-31，动态机制已撤。
async function loadAll(){
  const d0raw = $("#d0").value, d1raw = $("#d1").value;
  const d0ok = validYMD(d0raw), d1ok = validYMD(d1raw);
  const d0 = d0ok ? d0raw : "2015-01-01";
  if (!d0ok && d0raw) toast(`起日期「${d0raw}」不是合法日期 → 忽略，用 ${d0}`, false);
  // 4.1/4.4：从「开始日期」一直拉到库内最后一条；「止日期」只是初始窗口的右边界，
  // ▶ 可以越过它继续揭示（4.2），最多到数据库最后一根
  allBars = await api(`/api/klines?symbol=${symbol}&start=${d0}&end=2099-12-31`);
  if (!allBars.length){
    const meta = await api(`/api/coverage?symbol=${symbol}`).catch(()=>null);
    toast(meta && meta.in_db
      ? `该标的在库内但所选区间无数据（库内范围 ${meta.first}~${meta.last}）`
      : `本地仓库无此标的（现有覆盖：全市场 共 ${meta?meta.total:5829} 只），输入代码/名称可搜索可用标的`, false);
    return;
  }
  if (!d1ok){
    if (d1raw) toast(`止日期「${d1raw}」不是合法日期 → 忽略，显示到库内最后一条`, false);
    // 未指定 → 不设右边界：endIdx = -1 分支 → 显示全部（到库内最后一根）
  }
  // 初始视图：显示到「止日期」当根（或其前最近一根）；止日期未指定则显示全部
  let i = d1ok ? allBars.findIndex(b => b.date > d1raw) : -1;
  endIdx = Math.max(1, i === -1 ? allBars.length : i);
  newTrade();                              // 切标的 → 面板回到「新建」并刷新默认开仓日
  refresh(); renderOverlays();
  status(`${symName} · 视图截至 ${allBars[endIdx-1].date}（库内共 ${allBars.length} 根，至 ${allBars[allBars.length-1].date}）`);
  refreshMacroIfOpen();
}
// ── 视图右边缘：40px 是「贴边」基准，也是旧行为里新 bar 停的位置 ──
const PIN_RIGHT = 40;
// ★ getOffsetRightDistance() = 最后一根 bar 右侧的**空白像素数**，是视图横向位置的唯一真相
//   （klinecharts 拖动/缩放改的都是它；getVisibleRange 给的是索引，末端恒等于最后一根，判断不出位置）
const barSpace = () => (chart.getBarSpace() || {}).bar || 10;   // 单根 bar 的横向步进(px)
// 4.2 判据：还有空档（offset 明显大于贴边值）就认为「当前 bar 不在屏幕最右边」
const atRightEdge = () => chart.getOffsetRightDistance() <= PIN_RIGHT + barSpace()/2;
function refresh(offset = PIN_RIGHT){     // 重新喂裁剪数据（v10：换 loader 引用触发重载）
  chart.setDataLoader({ getBars: ({callback}) => callback(allBars.slice(0, endIdx)) });
  chart.setOffsetRightDistance(offset);
}
// 播放一步（◀/▶ 与方向键共用）：n>0 揭示 n 根，n<0 回退 n 根
function stepBars(n){
  const prev = endIdx;
  // 4.2 ▶：多显示一天（库里的下一个交易日），最多到数据库最后一根
  // 4.3 ◀：少显示一天，最多退到开始时间（开始那根不能消失）
  endIdx = Math.max(1, Math.min(allBars.length, endIdx + n));
  if (endIdx === prev){
    // 一根没动 → 不重载、不碰视图，否则单纯的「点一下到顶了」也会把视图拽到右边缘
    toast(n > 0 ? `已到数据库最后一条（${allBars[allBars.length-1].date}）` : "已到开始时间", false);
  } else {
    // 4.1 ▶ 且右侧本来就有空档 → 新 bar 落进空档，已有 K 线一根都不动：
    //     offset 就是「末端右侧空白」，新揭示 n 根会吃掉 n×barSpace，减掉即等价于原地不动
    // （4.2 已贴右边缘 / ◀ 回退 → 仍走旧逻辑：整幅贴到右边缘）
    const keepView = n > 0 && !atRightEdge();
    refresh(keepView ? Math.max(0, chart.getOffsetRightDistance() - n * barSpace()) : PIN_RIGHT);
    renderOverlays();
    if (editingId === null) defaultEntryDate();     // 视图一动，「默认开仓日」跟着挪
  }
  status(`${symName} · 当前最后 bar：${allBars[endIdx-1].date}（第 ${endIdx}/${allBars.length} 根）`);
  refreshMacroIfOpen();
}
document.querySelectorAll(".pb").forEach(b => b.onclick = () => stepBars(+b.dataset.n));

// 快捷键（2026-10-09）：← 回退一根 / → 揭示一根 —— 与 ◀1/▶1 完全同一条路。
// ⚠ 焦点在输入框/文本域里时**必须放行**：日期框、数字框本身就用方向键调值，抢了就没法改价了
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"
            || t.isContentEditable)) return;
  e.preventDefault();                     // 别让方向键滚动页面
  stepBars(e.key === "ArrowRight" ? 1 : -1);
});

// ── 4.2 画线：绘制 / 拖动 / 右键删除 全用 overlay 内置交互 ──
$("#draw").onclick = () => {
  drawing = true;
  const myId = "ln" + Date.now().toString(36);          // 客户端生成 id，落库/重建一一对应
  // ★ id 由闭包捕获（不读 e.overlay.id）：无论拖动整体还是拖端点、无论哪个回调，
  //   带的都是同一个 myId → 服务端按 id upsert，绝不会把"拖动"误存成"新建"
  chart.createOverlay({ id: myId, name: "segment", mode: "weak_magnet",
    // ★ 画完必须登记进 lineOverlays —— 否则 renderOverlays() 的「先删光再重建」管不到它，
    //   重新加载/播放时这条线会赖在图上不走（也不受 end_date ≤ 当前最后 bar 的过滤约束）
    onDrawEnd: e => { drawing = false; saveLine(e.overlay, myId); lineOverlays.push(myId); },
    onPressedMoveEnd: e => saveLine(e.overlay, myId),    // 整体拖动/端点拖动落定
    onRemoved: () => { if (!suppressRemove) fetch(`/api/lines?symbol=${symbol}&id=${myId}`, {method:"DELETE"}); }
  });
};
// 点位 → 记录：v10 事件的 points 可能带 timestamp 或 dataIndex，两种都接；
// 日期直接查 bar 表（拿到的是服务器原样日期串，零时区换算）
function pointRec(q){
  let ts = q.timestamp;
  if (ts == null && q.dataIndex != null && allBars[q.dataIndex]) ts = allBars[q.dataIndex].timestamp;
  const bar = tsBar(ts);
  return { date: bar ? bar.date : dOf(ts), price: q.value, ts };
}
async function saveLine(ov, fixedId){
  try {
    const id = fixedId || ov.id;
    if (!id) return toast("画线保存失败：内部错误（overlay 无 id）", false);
    const p = ov.points; if (!p || p.length < 2) return;
    const a = pointRec(p[0]), b = pointRec(p[1]);
    if (!a.date || !b.date) return toast("画线保存失败：点位无对应K线", false);
    const rec = { id, start_date: a.date, start_price: a.price,
                  end_date: b.date, end_price: b.price, adj: "hfq" };
    const r = await post("/api/lines", {symbol, line: rec});
    if (r) status(`${r._action === "update" ? "✏ 已更新" : "✚ 已新建"}线 [${id}]：`
                  + `${r.start_date} ${r.start_price.toFixed(2)} → ${r.end_date} ${r.end_price.toFixed(2)}`);
  } catch (err) {
    console.error("saveLine", err);
    toast("画线保存失败：" + (err && err.message || err), false);
  }
}

// ── 4.3 / 5.3 / 7.1 / 7.2：按当前视图重建 overlay ──
async function renderOverlays(){
  suppressRemove = true;                       // ★ 抑制 onRemoved，避免重建时误删库
  try {
    lineOverlays.forEach(id => chart.removeOverlay({id}));
    tradeOverlays.forEach(id => chart.removeOverlay({id}));
  } finally { suppressRemove = false; }
  lineOverlays = []; tradeOverlays = [];
  const lastDate = allBars[endIdx-1].date;
  if (settings.show_lines){
    const lines = await api(`/api/lines?symbol=${symbol}`);
    // 7.1 未来线不显示：4.2 **两端都判**（防御旧脏数据 start>end 的倒置记录——
    //     只看 end 会漏放一条"start 在未来"的线）
    lines.filter(l => l.end_date <= lastDate && l.start_date <= lastDate).forEach(l => {
      const lid = l.id;                                              // ★ 闭包捕获，同新建逻辑
      chart.createOverlay({ id: lid, name:"segment",
        points:[{timestamp:msOf(l.start_date), value:l.start_price},
                {timestamp:msOf(l.end_date),   value:l.end_price}],
        onPressedMoveEnd: e => saveLine(e.overlay, lid),
        onRemoved: () => { if (!suppressRemove) fetch(`/api/lines?symbol=${symbol}&id=${lid}`, {method:"DELETE"}); } });
      lineOverlays.push(l.id);
    });
  }
  if (settings.show_trades){
    const trades = await api(`/api/trades?symbol=${symbol}`);
    // 未来遮蔽**两级**：记录级只看开仓日是否已揭示；每个元素再各判自己的日期。
    // 一刀切 filter 表达不了「开仓日在未来 / 平仓日在未来」这种混合状态。
    trades.filter(t => t.entry_date && t.entry_date <= lastDate).forEach(t => {
      const id = "tr_"+t.id;
      const isShort = t.direction === "short";
      // ▲ 红三角 = 开仓（画在**开仓日**，价格就是真实成交价；做空标「开空」用绿色系↓）
      chart.createOverlay({ id: id+"_e", name:"triMarker",
        points:[{timestamp:msOf(t.entry_date), value:t.buy_price}],
        extendData:{ up:!isShort, label:(isShort?"开空 ":"开仓 ")+fmt(t.buy_price) },
        styles:{ polygon:{color:isShort?"#14b143":"#ef232a", borderColor:isShort?"#14b143":"#ef232a"},
                 text:{color:isShort?"#14b143":"#ef232a"} } });
      tradeOverlays.push(id+"_e");
      // 止损/止盈虚线**不画**（用户 2026-09-18：标注太多看不清，只留三角）
      // 需要时把 priceChannelLine 那两段加回来即可（起点用 t.entry_date）
      // ▼ 绿三角向下 = 平仓（未平仓 / 平仓日尚未揭示 → 不画；也**不显示任何浮盈数字**，
      //   那等于偷看未来）
      if (t.exit_date && t.exit_date <= lastDate){
        chart.createOverlay({ id:id+"_x", name:"triMarker",
          points:[{timestamp:msOf(t.exit_date), value:t.exit_price}],
          extendData:{ up:false, label:`${t.exit_reason} ${fmt(t.exit_price)}` },
          styles:{ polygon:{color:"#14b143", borderColor:"#14b143"}, text:{color:"#14b143"} } });
        tradeOverlays.push(id+"_x");
      }
    });
  }
}

// ── 交易录入面板 ──
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// 默认开仓时间 = 当前最后 bar 的**次日**（决策日收盘后、次日开盘成交）
// 已到库尾（没有下一根）时退回当前最后 bar 自身，免得输入框空着没得存
function defaultEntryDate(){
  const nb = allBars[endIdx];               // endIdx 指向第一根未揭示的 bar
  $("#tDate").value = nb ? nb.date : (allBars[endIdx-1] || {}).date || "";
}
function newTrade(){

  renderScoreBox();
  defaultEntryDate();
  previewTrade();
}
// 方向读写 + 占位符随方向切换（做空：止损在上、止盈在下）
// 用函数声明（非 const 箭头）——避免 newTrade() 在定义前被调用时踩 TDZ
function getDir(){ return (document.querySelector("input[name=tDir]:checked")||{value:"long"}).value; }
function dirPlaceholders(){
  const short = getDir() === "short";
  $("#tStop").placeholder = short ? "必填（做空：须高于开仓价）" : "必填（须低于开仓价）";
  $("#tTp").placeholder   = short ? "必填（做空：须低于开仓价）" : "必填（须高于开仓价）";
}
document.querySelectorAll("input[name=tDir]").forEach(r => r.addEventListener("change", () => {
  dirPlaceholders(); schedulePreview();
  // 方向一切换，评分选项组整个换（理由/其余项的名称都不同）→ 回到该方向的默认分
  if (pendingScore && pendingScore.direction !== getDir()){
    pendingScore = defaultScore(getDir());
    renderScoreBox();
    // ★ 2026-10-08：评分窗改成非模态后，切方向时窗口可能正开着 —— 必须连窗口内容一起重建，
    //   否则旧的滑杆还挂在上一个方向的项名上，会往新的 pendingScore.items 里写脏键

function setEditing(rec){
  editingId = rec.id;

  $("#tSave").textContent = "修改";

  $("#tStop").value = rec.stop_price ?? "";

  dirPlaceholders();
  // 评分载入：库里有 → 载入（可改，即「修改之前的评分选择」）；历史记录没有 → 默认口径
  const d = rec.direction || "long";
  pendingScore = (rec.score && rec.score.reason && scoreReasons(d).includes(rec.score.reason))
    ? { direction: d, reason: rec.score.reason,
        items: Object.fromEntries(SCORE_OPTS[d].items.map(n => [n, +((rec.score.items || {})[n] || 0)])) }
    : defaultScore(d, true);

// ── 开仓评分（2026-10-05；10-06 三轮扩项；10-09 做多侧 +突破类「牛市天际线」+其他项「是否历史最高」）──
// 理由类单选 60 分 + 其余各项各 0-10 分（做多 9 项 → 150 封顶 / 做空 8 项 → 140）
// 做多：突破类/摸底类统称理由类，互斥只能选一个（开仓逻辑只有一个）；做空：跌破/摸头同理
const SCORE_OPTS = {
  long: {
    reasonGroups: [["突破类", ["三头突破", "w底突破", "三角收敛突破", "牛市天际线"]],
                   ["摸底类", ["主力攻击成本摸底", "破线翻摸底", "双底摸底", "价格逐步提升摸底", "突破前摸底",
                              "震荡底部摸底"]]],
    items: ["价格处于底部", "距离历史价格高点较远", "不是下跌趋势反弹",
            "突破/摸底有量能配合", "二段涨幅起涨",
            "近期没有压力", "没有涨幅满足", "满足时间波对称", "是否历史最高"],
    defReason: "三头突破"
  },
  short: {
    reasonGroups: [["跌破类", ["三头跌破", "m头跌破", "三角形跌破"]],
                   ["摸头类", ["跌破反弹摸头", "假突破摸头", "m头第二个头摸头", "跌破前摸头",
                              "震荡顶部摸头"]]],
    items: ["价格处于高点", "距离历史价格低点较远", "不是上升趋势回调",
            "跌破/摸头有量能配合", "二段跌幅起跌",
            "近期是否没有支撑", "是否没有跌幅满足", "满足时间波对称"],
    defReason: "三头跌破"
  }
};
const scoreReasons = d => SCORE_OPTS[d].reasonGroups.map(g => g[1]).flat();
let pendingScore = null;      // {direction, reason, items:{}} —— 始终与面板方向同步
// legacy=true：历史记录口径（理由三头突破/跌破 + 其余各项 10 = 100）；
// 否则新交易默认：理由三头突破、其余各项 0 → 60 分（理由即达提交线，其余项可全 0）
function defaultScore(direction, legacy = false){
  const o = SCORE_OPTS[direction];
  return { direction, reason: o.defReason,
           items: Object.fromEntries(o.items.map(n => [n, legacy ? 10 : 0])) };
}
function scoreTotal(s){ return 60 + Object.values(s.items).reduce((a, b) => a + (+b || 0), 0); }
function scorePayload(){
  const s = pendingScore || defaultScore(getDir());
  return { reason: s.reason, items: { ...s.items }, total: scoreTotal(s) };
}
function renderScoreBox(){
  if (!pendingScore) return;
  const total = scoreTotal(pendingScore), box = $("#tScore");
  box.className = total >= 60 ? "ok" : "low";
  box.innerHTML = `<span class="sc-total">${total}</span>分 · 理由：${pendingScore.reason}`
    + `<br><span class="sc-hint">${total >= 60 ? "点击修改评分" : "低于 60 分不能提交 —— 点击评分补足其余各项"}</span>`;
  $("#tSave").disabled = total < 60;          // ★ 低于 60 分不能提交
}
// 二级评分浮窗：打开时快照，✕ / 取消 = 回滚；确定 = 应用并回到提交面板
// （★ 2026-10-08 起没有遮罩层了 —— 点浮窗外面不再关闭，只有 ✕ / 取消 两个出口）
let smBackup = null;
function openScoreModal(){
  const dir = getDir();
  if (!pendingScore || pendingScore.direction !== dir) pendingScore = defaultScore(dir);
  smBackup = JSON.parse(JSON.stringify(pendingScore));
  const o = SCORE_OPTS[dir];
  if (!scoreReasons(dir).includes(pendingScore.reason)) pendingScore.reason = o.defReason;
  o.items.forEach(n => { if (pendingScore.items[n] == null) pendingScore.items[n] = 0; });
  $("#smTitle").textContent = `开仓评分（${dir === "short" ? "做空" : "做多"}）`;
  let h = `<div class="sg-head">理由类（${dir === "short" ? "跌破 / 摸头" : "突破 / 摸底"}只能选一个 · 60 分 · 必选）</div>`;
  o.reasonGroups.forEach(([gname, opts]) => {
    h += `<div class="sg-head" style="color:#9aa3b2">· ${gname}</div>`;
    h += opts.map(r => `<label class="sopt"><input type="radio" name="smReason" value="${r}"
      ${pendingScore.reason === r ? "checked" : ""}> ${r}</label>`).join("");
  });
  h += `<div class="sg-head">其余各项（0-10 分）</div>`;
  h += o.items.map(n => `<div class="sitem"><label>${n}</label>
      <input type="range" min="0" max="10" step="1" data-item="${n}" value="${pendingScore.items[n]}">
      <span class="sv" data-sv="${n}">${pendingScore.items[n]}</span></div>`).join("");
  $("#smBody").innerHTML = h;
  $("#smBody").querySelectorAll("input[name=smReason]").forEach(r => r.onchange = () => {
    pendingScore.reason = r.value; smTotalUpd();
  });
  $("#smBody").querySelectorAll("input[type=range]").forEach(rg => rg.oninput = () => {
    pendingScore.items[rg.dataset.item] = +rg.value;
    $(`[data-sv="${rg.dataset.item}"]`).textContent = rg.value;
    smTotalUpd();
  });
  smTotalUpd();
  $("#scoreModal").classList.add("on");
}

async function previewTrade(){
  const box = $("#tPrev");
  const ed = $("#tDate").value;
  if (!ed){ box.className="prev err"; box.textContent="开仓时间必填"; return; }
  if (!$("#tStop").value || !$("#tTp").value){
    box.className="prev"; box.textContent="止损价、止盈价都必填 —— 出场只认你提交的这两个价。";
    return;
  }
  // 未来遮蔽：开仓日还没揭示时，**不显示该日开盘价与股数** —— 预览会把明天的开盘
  // 泄露出来（等于不按 ▶ 就偷看），而股数反算必然要用到它。揭示后自动出现。
  const lastDate = allBars.length ? allBars[endIdx-1].date : "";
  if (!$("#tBuy").value && ed > lastDate){
    box.className = "prev";
    box.innerHTML = `开仓日 <b>${ed}</b> 尚未揭示 → 开仓价 = 该日开盘价，`
      + `股数要等揭示后才算得出（不提前偷看次日）。<br>想立刻知道股数就手填开仓价。`;
    return;
  }
  try {
    const r = await post("/api/trades?dry_run=1", { symbol,
      trade:{ entry_date:ed, direction:getDir(), buy_price:$("#tBuy").value,
              stop_price:$("#tStop").value,
              tp_price:$("#tTp").value, id: editingId || undefined,
              score: scorePayload() },
      risk_amount: settings.risk_amount });
    box.className = r._duplicate ? "prev warn" : "prev";
    box.innerHTML = `<b>${r.direction==="short"?"做空":"做多"}</b> · `
      + `开仓 <b>${fmt(r.buy_price)}</b>（${r.entry_source==="bar_open"?"当日开盘":"手填"}）· `
      + `每股风险 <b>${fmt(r.risk_per_share)}</b>（${fmt(r.risk_pct*100)}%）· `
      + `可开 <b>${r.shares}</b> 股 · 开仓金额 ${wan(r.notional)} · 止损亏损 ${fmt(r.risk_amount,0)} 元`
      + (r._duplicate ? `<br>⚠ ${r.entry_date} 已有开仓记录，保存时会问是否覆盖` : "");
  } catch (e) {
    box.className = "prev err";
    box.textContent = (e.body && e.body.err) || e.message;
  }
}

// ── 浮窗拖动（标题栏按下拖动）──
function makeDraggable(el, handleSel = "h4, .mhead"){
  const h = el.querySelector(handleSel);
  if (!h) return;
  h.addEventListener("mousedown", e => {
    // 别抢输入框/下拉/关闭按钮的交互
    if (e.target.closest("input") || e.target.closest("[id$=Pop]") || (e.target.id || "").endsWith("Close")) return;
    const r = el.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    const move = ev => {
      el.style.left = Math.max(0, Math.min(innerWidth - 60, ev.clientX - dx)) + "px";
      el.style.top  = Math.max(0, Math.min(innerHeight - 40, ev.clientY - dy)) + "px";
      el.style.right = "auto";                       // 一旦拖过就交给 left 定位
    };
    const up = () => { document.removeEventListener("mousemove", move);
                       document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
  });
}

// ── 宏观行情：指数 close 曲线 + MA200（判牛熊）──
// ★ 2026-10-10：宏观默认指数 沪深300 → 创业板指 —— 练习池过半是创业板/科创板，
//   实测同批做多单按创业板指 MA200 分割最干净（牛 +9.1% vs 熊 −0.4%），闸门匹配池子
let macroChart = null, macroBars = [], macroSym = "399006.SZ", macroList = [];
async function ensureMacro(){
  if (macroChart) return;
  // ★ 必须在窗口可见后再 init —— 容器 display:none 时 klinecharts 量到 0×0
  macroChart = klinecharts.init("macroChart", { styles: {
    candle: {
      type: "area",                                  // 只要 close 曲线，不画 K 线
      area: { lineSize: 2, lineColor: "#4a90d9", smooth: true,
              backgroundColor: [{ offset: 0, color: "rgba(74,144,217,.02)" },
                                { offset: 1, color: "rgba(74,144,217,.20)" }] },
      priceMark: { high: { show: false }, low: { show: false },
                   last: { show: true, upColor: "#ef232a", downColor: "#14b143", noChangeColor: "#7a8494" } },
      tooltip: { legend: { template: [
        { title: "日期", value: "{time}" }, { title: "收盘", value: "{close}" }] } }
    },
    grid: { horizontal: { show: true, color: "#26292f", style: "dashed", dashedValue: [2, 3] },
            vertical:   { show: true, color: "#26292f", style: "dashed", dashedValue: [2, 3] } },
    indicator: { lines: [{ color: "#e8c35a", size: 1.5 }] },   // MA200 的颜色
    crosshair: { horizontal: { text: { backgroundColor: "#3a3f4b" } },
                 vertical:   { text: { backgroundColor: "#3a3f4b" } } }
  }});
  macroChart.setSymbol({ ticker: macroSym, pricePrecision: 2 });
  macroChart.setPeriod({ span: 1, type: "day" });
  macroChart.setDataLoader({ getBars: ({ callback }) => callback(macroBars) });
  // 只要 200 日线：内置 MA 的 regenerateFigures 会按 calcParams 重生成标题 → 显示 "MA200: "
  // ★ 必须显式给 paneId:"candle_pane"（主图），否则 createIndicator 会**另开一个附图**
  //   （paneId 不传就生成新 id）→ MA200 会画在下面单独一块，看不到它跟 close 的关系。
  //   第二个参数 isStack=true 是防止 addIndicator 顺手清掉该 pane 已有的指标。
  macroChart.createIndicator({ name: "MA", calcParams: [200], paneId: "candle_pane" }, true);
}
// 宏观窗口的区间 = **主图当前区间**：起点取「起」日期，终点取**当前已揭示的最后一根**
// （跟着 ▶/◀ 走）—— 否则宏观窗口会显示主图还没揭示的日子，等于偷看未来
const macroRange = () => ({
  start: $("#d0").value || "2015-01-01",
  end: allBars.length ? allBars[endIdx - 1].date : ($("#d1").value || "2099-01-01"),
});
async function loadMacro(sym){
  if (sym) macroSym = sym;
  if (!macroList.length) macroList = await api("/api/indices");    // 直接点按钮进来时清单还没拉过
  const { start, end } = macroRange();
  macroBars = await api(`/api/index_klines?symbol=${macroSym}&start=${start}&end=${end}`);
  await ensureMacro();
  macroChart.setDataLoader({ getBars: ({ callback }) => callback(macroBars) });   // 换引用触发重载
  macroChart.setOffsetRightDistance(24);
  const nm = (macroList.find(x => x.symbol === macroSym) || {}).name || macroSym;
  $("#mIdx").value = `${macroSym} ${nm}`;
  // 提示行：收盘 vs MA200 —— 这就是判牛熊的那个数
  const n = macroBars.length;
  if (!n){
    $("#mHint").innerHTML = `该区间无数据（${start} ~ ${end}）—— 指数与主图同区间，`
      + `把「起」日期往前调，或按 ◀ 回到更早的日期`;
    return;
  }
  const range = `区间 <b>${macroBars[0].date} ~ ${macroBars[n-1].date}</b>（${n} 根，与主图一致）`;
  const cs = macroBars.map(b => b.close);
  if (n < 200){
    $("#mHint").innerHTML = `${range}<br>不足 200 根，算不出 MA200`;
    return;
  }
  const ma = cs.slice(-200).reduce((a, b) => a + b, 0) / 200;
  const last = macroBars[n - 1], dev = (last.close / ma - 1) * 100;
  const bear = last.close < ma;
  $("#mHint").innerHTML = `最新 <b>${last.date}</b> 收 <b>${fmt(last.close)}</b> · `
    + `MA200 <b>${fmt(ma)}</b> · 偏离 <b class="${bear ? "bear" : "bull"}">`
    + `${dev > 0 ? "+" : ""}${dev.toFixed(2)}%</b>　→　`
    + (bear ? `<b class="bear">在 MA200 下方（熊市区）</b>` : `<b class="bull">在 MA200 上方（多头区）</b>`)
    + `<br>${range}` + (n < 400 ? `　·　MA200 前 199 根是空的（预热不足）` : "");
}
$("#mIdx").onfocus = async () => {
  if (!macroList.length) macroList = await api("/api/indices");

function mIdxFilter(q){
  const box = $("#mIdxPop");
  const hit = macroList.filter(x => !q || x.symbol.toLowerCase().includes(q)
                                 || x.name.toLowerCase().includes(q));
  box.innerHTML = hit.map(x => `<div data-s="${x.symbol}">${x.symbol} ${x.name}</div>`).join("");
  box.style.display = hit.length ? "block" : "none";

    loadMacro(d.dataset.s).catch(e => toast("指数加载失败：" + e.message, false));

}

  const box = $("#nDates");

      box.innerHTML = `<span style="cursor:default">该标的还没有交易记录 —— 日期可直接填，或先提交那笔交易</span>`;

    box.querySelectorAll("[data-d]").forEach(s => s.onclick = () => $("#nDate").value = s.dataset.d);
