<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cs-trend-train · 手动趋势画线交易训练</title>
<script src="klinecharts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: #16181d; color: #d8dce3; }
  #top { display: flex; gap: 8px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
  #top input, #top button, #top select { background: #23262e; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 8px; font-size: 13px; }
  #top button { cursor: pointer; }
  #top button:hover { background: #2e323c; }
  #symList { position: absolute; z-index: 99; background: #23262e; border: 1px solid #3a3f4b;
      border-radius: 4px; max-height: 240px; overflow-y: auto; min-width: 220px; }
  #symList div { padding: 5px 10px; cursor: pointer; }
  #symList div:hover { background: #2e323c; }
  .grp { display: flex; gap: 6px; align-items: center; padding: 2px 10px 2px 0; }
  .grp b { color: #9aa3b2; font-weight: 600; }
  #chart { width: 100%; height: calc(100vh - 96px); position: relative; }
  .drawer { position: absolute; right: 12px; z-index: 50; width: 250px; display: none;
      background: rgba(35,38,46,.96); border: 1px solid #3a3f4b; border-radius: 6px; padding: 10px; }
  #panel { top: 52px; }
  #setPanel { top: 52px; }
  #notePanel { top: 52px; }
  .drawer textarea { width: 100%; background: #1b1e24; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 6px; font: inherit; resize: vertical; }
  #nSymPop { position: absolute; z-index: 60; display: none; left: 0; right: 0; max-height: 200px;
      overflow-y: auto; background: #23262e; border: 1px solid #3a3f4b; border-radius: 4px; }
  #nSymPop div { padding: 5px 10px; cursor: pointer; font-size: 12px; }
  #nSymPop div:hover { background: #2e323c; }
  #nDates { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #nDates span { background: #2a2e38; border: 1px solid #3a3f4b; border-radius: 3px;
      padding: 1px 6px; font-size: 11px; color: #9aa3b2; cursor: pointer; }
  #nDates span:hover { color: #d8dce3; border-color: #4a5060; }
  .drawer h4 { font-size: 13px; color: #9aa3b2; margin-bottom: 8px; display: flex;
      justify-content: space-between; align-items: center; }
  .drawer h4 span { cursor: pointer; color: #7a8494; font-weight: 400; }
  .drawer label.f { display: block; font-size: 11px; color: #9aa3b2; margin: 6px 0 2px; }
  .drawer input { width: 100%; background: #1b1e24; color: #d8dce3; border: 1px solid #3a3f4b;
      border-radius: 4px; padding: 4px 6px; }
  .drawer button { width: 100%; background: #2b5fad; color: #fff; border: 0; border-radius: 4px;
      padding: 6px; cursor: pointer; margin-top: 8px; }
  .drawer button:hover { background: #3571c4; }
  .drawer button.alt { background: #3a3f4b; margin-top: 4px; }
  .drawer button.alt:hover { background: #4a5060; }
  .drawer button.danger { background: #8c3a3a; margin-top: 10px; }
  .drawer button.danger:hover { background: #a54444; }
  .drawer button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 11px; color: #7a8494; margin-top: 8px; line-height: 1.45; }
  #tPrev { font-size: 11px; margin-top: 8px; padding: 6px; border-radius: 4px;
      background: #1b1e24; color: #9aa3b2; min-height: 30px; line-height: 1.45; }
  #tPrev.err { background: #3a2020; color: #e88; }
  #tPrev.warn { background: #3a3320; color: #e8c35a; }
  #tPrev b { color: #d8dce3; }
  label.ck { display: flex; gap: 6px; align-items: center; cursor: pointer; margin: 6px 0; }
  label.ck input { width: auto; }
  #msg { position: absolute; left: 50%; transform: translateX(-50%); top: 48px; z-index: 60;
      background: #2e5c2e; padding: 6px 16px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<div id="top">
  <div style="position:relative">
    <input id="sym" placeholder="代码/名称/拼音首字母" style="width:170px" value="601318.SH 中国平安">
    <div id="symList" style="display:none"></div>
  </div>
  <div class="grp"><b>起</b><input id="d0" type="date" value="2025-01-01"></div>
  <div class="grp"><b>止</b><input id="d1" type="date" value="2026-08-31"></div>
  <button id="load">加载</button>
  <div class="grp" style="margin-left:12px">
    <button class="pb" data-n="-10">◀10</button><button class="pb" data-n="-1">◀1</button>
    <button class="pb" data-n="1">▶1</button><button class="pb" data-n="10">▶10</button>
  </div>
  <button id="draw">✏ 画趋势线</button>
  <button id="openTrade">📥 提交交易</button>
  <button id="openNote">📝 交易心得</button>
  <button id="openStats">📊 交易统计</button>
  <button id="openSet">⚙ 设置</button>
  <span id="status" style="color:#7a8494"></span>
</div>
<div id="chart"></div>

<!-- 提交交易面板：按钮开合；保存成功后按钮变「修改」 -->
<div id="panel" class="drawer">
  <h4><span id="tTitle">提交交易</span><span id="tClose">✕</span></h4>
  <label class="f">开仓时间 *</label>
  <input id="tDate" type="date">
  <label class="f">开仓价（留空 = 该日开盘价）</label>
  <input id="tBuy" type="number" step="0.01" placeholder="留空 = 当日开盘价">
  <label class="f">止损价 *</label>
  <input id="tStop" type="number" step="0.01" placeholder="必填">
  <label class="f">止盈价 *</label>
  <input id="tTp" type="number" step="0.01" placeholder="必填">
  <div id="tPrev">—</div>
  <button id="tSave">保存</button>
  <button id="tNew" class="alt">＋ 新建一笔</button>
  <div class="hint">出场只认你提交的止损/止盈价：从开仓日当根逐日判定，同日双触按止损计，
    跳空越过触发价按当日开盘价成交。</div>
</div>

<!-- 交易心得面板：佐证标的 + 开仓日期 + 标题 + 内容 -->
<div id="notePanel" class="drawer">
  <h4><span id="nTitle">写交易心得</span><span id="nClose">✕</span></h4>
  <label class="f">佐证标的 *</label>
  <div style="position:relative">
    <input id="nSym" placeholder="代码 / 名称 / 拼音首字母" autocomplete="off">
    <div id="nSymPop"></div>
  </div>
  <label class="f">开仓日期 *</label>
  <input id="nDate" type="date">
  <div id="nDates"></div>
  <label class="f">心得标题（可留空）</label>
  <input id="nTitleIn" placeholder="一句话概括">
  <label class="f">心得内容 *</label>
  <textarea id="nContent" rows="6" placeholder="当时怎么想的？错在哪？下次怎么做？"></textarea>
  <button id="nSave">保存</button>
  <button id="nNew" class="alt">＋ 新建一条</button>
  <div class="hint">必填：佐证标的 + 开仓日期 + 内容。已写的心得在「📊 交易统计 → 交易心得」里查看 / 修改 / 删除。</div>
</div>

<!-- 设置面板：显示开关 + 全局止损额度 + 清除当前标的记录 -->
<div id="setPanel" class="drawer">
  <h4><span>设置</span><span id="sClose">✕</span></h4>
  <label class="ck"><input type="checkbox" id="sLines">显示趋势线</label>
  <label class="ck"><input type="checkbox" id="sTrades">显示交易标注</label>
  <label class="f">止损额度（元 · 全局，与标的无关）</label>
  <input id="sRisk" type="number" step="100" min="100">
  <div class="hint">改额度只影响**以后**提交的交易；已提交的仓位是历史事实，不会重算。</div>
  <button id="sClear" class="danger">清除当前标的交易记录</button>
  <div class="hint">只清 <b id="sSymName">—</b> 一个标的，不可恢复（会先二次确认）。</div>
</div>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
let chart, allBars = [], endIdx = 0, symbol = "601318.SH", symName = "中国平安";
let drawing = false, lineOverlays = [], tradeOverlays = [];
let settings = { risk_amount: 5000, show_lines: true, show_trades: false };
let editingId = null;                     // 非空 = 面板处于「修改」模式
// ⚠ klinecharts 的 removeOverlay() 会**无条件触发 overlay 的 onRemoved 回调** ——
//   而 renderOverlays() 是「先删光再重建」，若不抑制，每次重建都会把刚从服务器
//   读出来的线 DELETE 回去（表现为：一按播放键线就消失，且库里也被清空）。
//   故重建期间置 true，让 onRemoved 区分「程序化重建」与「用户右键删除」。
let suppressRemove = false;

function toast(t, ok=true){ const m=$("#msg"); m.textContent=t;
  m.style.background = ok?"#2e5c2e":"#8c3a3a"; m.style.display="block";
  setTimeout(()=>m.style.display="none", 3000); }
const status = t => $("#status").textContent = t;
const msOf = d => new Date(d+"T00:00:00").getTime();
const fmt = (n,d=2) => (n==null||isNaN(n)) ? "—" : Number(n).toFixed(d);
const wan = n => (n==null||isNaN(n)) ? "—" : (n/10000).toFixed(1)+"万";
// 本地日期格式化（toISOString 是 UTC，东八区会前移一天）
const dOf = ts => { const d=new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
// timestamp → 该 bar 的日期字符串（直接查表，避免任何时区换算）
const tsBar = ts => allBars.find(b => b.timestamp === ts);
// api：非 2xx 时抛出带 status/body 的错误，方便区分 409（同日撞车）做二次确认
async function api(p, o){
  const r = await fetch(p, o), txt = await r.text();
  let j = null; try { j = JSON.parse(txt); } catch(_) {}
  if (!r.ok) throw Object.assign(new Error((j && j.err) || txt || ("HTTP "+r.status)),
                                { status: r.status, body: j });
  return j !== null ? j : txt;
}
const post = (p, body) => api(p, { method:"POST", headers:{"Content-Type":"application/json"},
                                   body: JSON.stringify(body) });

// ── 自定义 overlay：价格处的三角标记（开仓红▲向上 / 平仓绿▼向下）──
//   为什么不直接用内置 simpleAnnotation：它的三角**写死朝下**（是价格上方 50px 处的
//   一个"标注钉"），颜色走全局默认 styles.polygon（蓝）—— 所以 `styles.point.color`
//   与 `styles.text.content` 都没生效过（旧代码的文字标签其实一直没渲染）。
//   ★ 样式优先级：全局默认 → overlay.styles[figure.type] → **figure.styles（最高）**。
//     只写 overlay 级不够：`text` figure 会继承全局的 style:"fill" 把自己画成一个色块，
//     反而把三角盖住（实测是蓝方块）。所以两个 figure 都显式带 figure 级 styles。
klinecharts.registerOverlay({
  name: "triMarker",
  totalStep: 2,
  styles: { polygon: { style:"fill", color:"#ef232a", borderColor:"#ef232a", borderSize:0 },
            text:    { color:"#ef232a", size:11 } },
  createPointFigures: ({ coordinates, overlay }) => {
    const p = coordinates[0]; if (!p) return [];
    const ed = overlay.extendData || {};
    const up = ed.up !== false, S = 8, half = S * 0.72;
    const c = (overlay.styles && overlay.styles.polygon && overlay.styles.polygon.color) || "#ef232a";
    return [
      { type:"polygon", ignoreEvent:true,
        styles:{ style:"fill", color:c, borderColor:c, borderSize:0 },
        attrs:{ coordinates: up
          ? [{x:p.x, y:p.y - S}, {x:p.x - half, y:p.y}, {x:p.x + half, y:p.y}]      // 尖朝上
          : [{x:p.x, y:p.y + S}, {x:p.x - half, y:p.y}, {x:p.x + half, y:p.y}] } }, // 尖朝下
      { type:"text", ignoreEvent:true,
        // 背景/边框全部透明，否则默认会画出一个色块标签
        styles:{ color:c, size:11, style:"fill",
                 backgroundColor:"rgba(0,0,0,0)", borderColor:"rgba(0,0,0,0)", borderSize:0 },
        attrs:{ x:p.x, text: ed.label || "",
                y: up ? p.y - S - 3 : p.y + S + 3, align:"center", baseline: up ? "bottom" : "top" } },
    ];
  }
});

// ── klinecharts v10 初始化 ──
function initChart(){
  chart = klinecharts.init("chart", { styles: {
    candle: {
      bar: { upColor:"#ef232a", downColor:"#14b143", upBorderColor:"#ef232a",
             downBorderColor:"#14b143", upWickColor:"#ef232a", downWickColor:"#14b143" },
      // ③ 在原有那行末尾追加「成交额」「收益率」
      //    title 查不到 locale 键时会**原样输出**，所以可直接写中文
      //    {turnover} / {change} 是 KLineData 标准字段，由后端随每根 bar 下发
      tooltip: { legend: { template: [
        { title:"time",   value:"{time}"   },
        { title:"open",   value:"{open}"   },
        { title:"high",   value:"{high}"   },
        { title:"low",    value:"{low}"    },
        { title:"close",  value:"{close}"  },
        { title:"volume", value:"{volume}" },
        { title:"成交额(亿)：", value:"{turnover}" },
        { title:"收益率：",     value:"{change}" }
      ] } }
    },
    grid: { horizontal:{show:true,color:"#26292f",style:"dashed",dashedValue:[2,3]},
            vertical:{show:true,color:"#26292f",style:"dashed",dashedValue:[2,3]} },
    // VOL 柱颜色与主图蜡烛是**两组独立配置**：蜡烛用 candle.bar，VOL 用 indicator.bars[0]
    // （默认是美股绿涨红跌，必须显式覆盖成 A 股口径）
    indicator: { bars: [{ upColor:"#ef232a", downColor:"#14b143", noChangeColor:"#7a8494" }] },
    crosshair: { horizontal:{text:{backgroundColor:"#3a3f4b"}}, vertical:{text:{backgroundColor:"#3a3f4b"}} },
    overlay: { point:{color:"#e8c35a",borderColor:"#16181d"}, line:{color:"#e8c35a",size:1} }
  }});
  chart.setSymbol({ ticker: symbol, pricePrecision: 2 });
  chart.setPeriod({ span: 1, type: "day" });
  chart.setDataLoader({ getBars: ({callback}) => callback(allBars.slice(0, endIdx)) });
  // ① 成交量附图：calcParams 传空数组 → regenerateFigures 只留 bar，去掉默认的 MA5/10/20 均线
  //    ⚠ createIndicator(indicators, isStack) 只有两个参数 —— 配置必须作为**第一个参数**传对象，
  //      写成 createIndicator("VOL", false, {calcParams:[]}) 会把配置对象当成 isStack 丢掉
  chart.createIndicator({ name: "VOL", calcParams: [] });
  // ② tooltip 字段由下方 styles.candle.tooltip.legend.template 配置（内置，无需自绘）
}

// ── 数据加载 / 播放（6.3：endIdx 相对结束时间移动）──
async function loadSettings(){
  try { settings = await api("/api/settings"); } catch(_) {}
  $("#sLines").checked  = !!settings.show_lines;
  $("#sTrades").checked = !!settings.show_trades;
  $("#sRisk").value = settings.risk_amount;
}
async function loadAll(){
  const [d0, d1] = [$("#d0").value, $("#d1").value];
  // 4.1/4.4：从「开始日期」一直拉到库内最后一条；「止日期」只是初始窗口的右边界，
  // ▶ 可以越过它继续揭示（4.2），最多到数据库最后一根
  allBars = await api(`/api/klines?symbol=${symbol}&start=${d0}&end=2099-12-31`);
  if (!allBars.length){
    const meta = await api(`/api/coverage?symbol=${symbol}`).catch(()=>null);
    toast(meta && meta.in_db
      ? `该标的在库内但所选区间无数据（库内范围 ${meta.first}~${meta.last}）`
      : `本地仓库无此标的（现有覆盖：沪深300∪中证500 共 ${meta?meta.total:1578} 只），输入代码/名称可搜索可用标的`, false);
    return;
  }
  // 初始视图：显示到「止日期」当根（或其前最近一根）
  let i = allBars.findIndex(b => b.date > d1);
  endIdx = Math.max(1, i === -1 ? allBars.length : i);
  newTrade();                              // 切标的 → 面板回到「新建」并刷新默认开仓日
  refresh(); renderOverlays();
  status(`${symName} · 视图截至 ${allBars[endIdx-1].date}（库内共 ${allBars.length} 根，至 ${allBars[allBars.length-1].date}）`);
}
// ── 视图右边缘：40px 是「贴边」基准，也是旧行为里新 bar 停的位置 ──
const PIN_RIGHT = 40;
// ★ getOffsetRightDistance() = 最后一根 bar 右侧的**空白像素数**，是视图横向位置的唯一真相
//   （klinecharts 拖动/缩放改的都是它；getVisibleRange 给的是索引，末端恒等于最后一根，判断不出位置）
const barSpace = () => (chart.getBarSpace() || {}).bar || 10;   // 单根 bar 的横向步进(px)
// 4.2 判据：还有空档（offset 明显大于贴边值）就认为「当前 bar 不在屏幕最右边」
const atRightEdge = () => chart.getOffsetRightDistance() <= PIN_RIGHT + barSpace()/2;
function refresh(offset = PIN_RIGHT){     // 重新喂裁剪数据（v10：换 loader 引用触发重载）
  chart.setDataLoader({ getBars: ({callback}) => callback(allBars.slice(0, endIdx)) });
  chart.setOffsetRightDistance(offset);
}
document.querySelectorAll(".pb").forEach(b => b.onclick = () => {
  const n = +b.dataset.n;
  const prev = endIdx;
  // 4.2 ▶：多显示一天（库里的下一个交易日），最多到数据库最后一根
  // 4.3 ◀：少显示一天，最多退到开始时间（开始那根不能消失）
  endIdx = Math.max(1, Math.min(allBars.length, endIdx + n));
  if (endIdx === prev){
    // 一根没动 → 不重载、不碰视图，否则单纯的「点一下到顶了」也会把视图拽到右边缘
    toast(n > 0 ? `已到数据库最后一条（${allBars[allBars.length-1].date}）` : "已到开始时间", false);
  } else {
    // 4.1 ▶ 且右侧本来就有空档 → 新 bar 落进空档，已有 K 线一根都不动：
    //     offset 就是「末端右侧空白」，新揭示 n 根会吃掉 n×barSpace，减掉即等价于原地不动
    // （4.2 已贴右边缘 / ◀ 回退 → 仍走旧逻辑：整幅贴到右边缘）
    const keepView = n > 0 && !atRightEdge();
    refresh(keepView ? Math.max(0, chart.getOffsetRightDistance() - n * barSpace()) : PIN_RIGHT);
    renderOverlays();
    if (editingId === null) defaultEntryDate();     // 视图一动，「默认开仓日」跟着挪
  }
  status(`${symName} · 当前最后 bar：${allBars[endIdx-1].date}（第 ${endIdx}/${allBars.length} 根）`);
});

// ── 4.2 画线：绘制 / 拖动 / 右键删除 全用 overlay 内置交互 ──
$("#draw").onclick = () => {
  drawing = true;
  const myId = "ln" + Date.now().toString(36);          // 客户端生成 id，落库/重建一一对应
  // ★ id 由闭包捕获（不读 e.overlay.id）：无论拖动整体还是拖端点、无论哪个回调，
  //   带的都是同一个 myId → 服务端按 id upsert，绝不会把"拖动"误存成"新建"
  chart.createOverlay({ id: myId, name: "segment", mode: "weak_magnet",
    // ★ 画完必须登记进 lineOverlays —— 否则 renderOverlays() 的「先删光再重建」管不到它，
    //   重新加载/播放时这条线会赖在图上不走（也不受 end_date ≤ 当前最后 bar 的过滤约束）
    onDrawEnd: e => { drawing = false; saveLine(e.overlay, myId); lineOverlays.push(myId); },
    onPressedMoveEnd: e => saveLine(e.overlay, myId),    // 整体拖动/端点拖动落定
    onRemoved: () => { if (!suppressRemove) fetch(`/api/lines?symbol=${symbol}&id=${myId}`, {method:"DELETE"}); }
  });
};
// 点位 → 记录：v10 事件的 points 可能带 timestamp 或 dataIndex，两种都接；
// 日期直接查 bar 表（拿到的是服务器原样日期串，零时区换算）
function pointRec(q){
  let ts = q.timestamp;
  if (ts == null && q.dataIndex != null && allBars[q.dataIndex]) ts = allBars[q.dataIndex].timestamp;
  const bar = tsBar(ts);
  return { date: bar ? bar.date : dOf(ts), price: q.value, ts };
}
async function saveLine(ov, fixedId){
  try {
    const id = fixedId || ov.id;
    if (!id) return toast("画线保存失败：内部错误（overlay 无 id）", false);
    const p = ov.points; if (!p || p.length < 2) return;
    const a = pointRec(p[0]), b = pointRec(p[1]);
    if (!a.date || !b.date) return toast("画线保存失败：点位无对应K线", false);
    const rec = { id, start_date: a.date, start_price: a.price,
                  end_date: b.date, end_price: b.price, adj: "hfq" };
    const r = await post("/api/lines", {symbol, line: rec});
    if (r) status(`${r._action === "update" ? "✏ 已更新" : "✚ 已新建"}线 [${id}]：`
                  + `${r.start_date} ${r.start_price.toFixed(2)} → ${r.end_date} ${r.end_price.toFixed(2)}`);
  } catch (err) {
    console.error("saveLine", err);
    toast("画线保存失败：" + (err && err.message || err), false);
  }
}

// ── 4.3 / 5.3 / 7.1 / 7.2：按当前视图重建 overlay ──
async function renderOverlays(){
  suppressRemove = true;                       // ★ 抑制 onRemoved，避免重建时误删库
  try {
    lineOverlays.forEach(id => chart.removeOverlay({id}));
    tradeOverlays.forEach(id => chart.removeOverlay({id}));
  } finally { suppressRemove = false; }
  lineOverlays = []; tradeOverlays = [];
  const lastDate = allBars[endIdx-1].date;
  if (settings.show_lines){
    const lines = await api(`/api/lines?symbol=${symbol}`);
    // 7.1 未来线不显示：4.2 **两端都判**（防御旧脏数据 start>end 的倒置记录——
    //     只看 end 会漏放一条"start 在未来"的线）
    lines.filter(l => l.end_date <= lastDate && l.start_date <= lastDate).forEach(l => {
      const lid = l.id;                                              // ★ 闭包捕获，同新建逻辑
      chart.createOverlay({ id: lid, name:"segment",
        points:[{timestamp:msOf(l.start_date), value:l.start_price},
                {timestamp:msOf(l.end_date),   value:l.end_price}],
        onPressedMoveEnd: e => saveLine(e.overlay, lid),
        onRemoved: () => { if (!suppressRemove) fetch(`/api/lines?symbol=${symbol}&id=${lid}`, {method:"DELETE"}); } });
      lineOverlays.push(l.id);
    });
  }
  if (settings.show_trades){
    const trades = await api(`/api/trades?symbol=${symbol}`);
    // 未来遮蔽**两级**：记录级只看开仓日是否已揭示；每个元素再各判自己的日期。
    // 一刀切 filter 表达不了「开仓日在未来 / 平仓日在未来」这种混合状态。
    trades.filter(t => t.entry_date && t.entry_date <= lastDate).forEach(t => {
      const id = "tr_"+t.id;
      // ▲ 红三角向上 = 开仓（画在**开仓日**，价格就是真实成交价）
      chart.createOverlay({ id: id+"_e", name:"triMarker",
        points:[{timestamp:msOf(t.entry_date), value:t.buy_price}],
        extendData:{ up:true, label:"开仓 "+fmt(t.buy_price) },
        styles:{ polygon:{color:"#ef232a", borderColor:"#ef232a"}, text:{color:"#ef232a"} } });
      tradeOverlays.push(id+"_e");
      // 止损/止盈虚线：起点是**开仓日**（开仓前不存在这两条线）
      if (t.stop_price) chart.createOverlay({ id:id+"_s", name:"priceChannelLine",
        points:[{timestamp:msOf(t.entry_date), value:t.stop_price},
                {timestamp:msOf(t.exit_date||lastDate), value:t.stop_price}],
        styles:{ line:{color:"#14b143", style:"dashed"} } });
      if (t.tp_price) chart.createOverlay({ id:id+"_t", name:"priceChannelLine",
        points:[{timestamp:msOf(t.entry_date), value:t.tp_price},
                {timestamp:msOf(t.exit_date||lastDate), value:t.tp_price}],
        styles:{ line:{color:"#ef232a", style:"dashed"} } });
      tradeOverlays.push(id+"_s", id+"_t");
      // ▼ 绿三角向下 = 平仓（未平仓 / 平仓日尚未揭示 → 不画；也**不显示任何浮盈数字**，
      //   那等于偷看未来）
      if (t.exit_date && t.exit_date <= lastDate){
        chart.createOverlay({ id:id+"_x", name:"triMarker",
          points:[{timestamp:msOf(t.exit_date), value:t.exit_price}],
          extendData:{ up:false, label:`${t.exit_reason} ${fmt(t.exit_price)}` },
          styles:{ polygon:{color:"#14b143", borderColor:"#14b143"}, text:{color:"#14b143"} } });
        tradeOverlays.push(id+"_x");
      }
    });
  }
}

// ── 交易录入面板 ──
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// 默认开仓时间 = 当前最后 bar 的**次日**（决策日收盘后、次日开盘成交）
// 已到库尾（没有下一根）时退回当前最后 bar 自身，免得输入框空着没得存
function defaultEntryDate(){
  const nb = allBars[endIdx];               // endIdx 指向第一根未揭示的 bar
  $("#tDate").value = nb ? nb.date : (allBars[endIdx-1] || {}).date || "";
}
function newTrade(){
  editingId = null;
  $("#tTitle").textContent = "提交交易";
  $("#tSave").textContent = "保存";
  ["#tBuy","#tStop","#tTp"].forEach(s => $(s).value = "");
  defaultEntryDate();
  previewTrade();
}
function setEditing(rec){
  editingId = rec.id;
  $("#tTitle").textContent = "修改交易";
  $("#tSave").textContent = "修改";
  $("#tDate").value = rec.entry_date || "";
  $("#tBuy").value  = rec.buy_price ?? "";
  $("#tStop").value = rec.stop_price ?? "";
  $("#tTp").value   = rec.tp_price ?? "";
  previewTrade();
}
let prevTimer;
function schedulePreview(){ clearTimeout(prevTimer); prevTimer = setTimeout(previewTrade, 250); }
["#tDate","#tBuy","#tStop","#tTp"].forEach(s => $(s).addEventListener("input", schedulePreview));
async function previewTrade(){
  const box = $("#tPrev");
  const ed = $("#tDate").value;
  if (!ed){ box.className="prev err"; box.textContent="开仓时间必填"; return; }
  if (!$("#tStop").value || !$("#tTp").value){
    box.className="prev"; box.textContent="止损价、止盈价都必填 —— 出场只认你提交的这两个价。";
    return;
  }
  // 未来遮蔽：开仓日还没揭示时，**不显示该日开盘价与股数** —— 预览会把明天的开盘
  // 泄露出来（等于不按 ▶ 就偷看），而股数反算必然要用到它。揭示后自动出现。
  const lastDate = allBars.length ? allBars[endIdx-1].date : "";
  if (!$("#tBuy").value && ed > lastDate){
    box.className = "prev";
    box.innerHTML = `开仓日 <b>${ed}</b> 尚未揭示 → 开仓价 = 该日开盘价，`
      + `股数要等揭示后才算得出（不提前偷看次日）。<br>想立刻知道股数就手填开仓价。`;
    return;
  }
  try {
    const r = await post("/api/trades?dry_run=1", { symbol,
      trade:{ entry_date:ed, buy_price:$("#tBuy").value, stop_price:$("#tStop").value,
              tp_price:$("#tTp").value, id: editingId || undefined },
      risk_amount: settings.risk_amount });
    box.className = r._duplicate ? "prev warn" : "prev";
    box.innerHTML = `开仓 <b>${fmt(r.buy_price)}</b>（${r.entry_source==="bar_open"?"当日开盘":"手填"}）· `
      + `每股风险 <b>${fmt(r.risk_per_share)}</b>（${fmt(r.risk_pct*100)}%）· `
      + `可开 <b>${r.shares}</b> 股 · 开仓金额 ${wan(r.notional)} · 止损亏损 ${fmt(r.risk_amount,0)} 元`
      + (r._duplicate ? `<br>⚠ ${r.entry_date} 已有开仓记录，保存时会问是否覆盖` : "");
  } catch (e) {
    box.className = "prev err";
    box.textContent = (e.body && e.body.err) || e.message;
  }
}
$("#tSave").onclick = async () => {
  const ed = $("#tDate").value;
  if (!ed) return toast("开仓时间必填", false);
  if (!$("#tStop").value) return toast("止损价必填", false);
  if (!$("#tTp").value)   return toast("止盈价必填", false);
  const mk = extra => ({ symbol, risk_amount: settings.risk_amount, ...extra,
    trade:{ id: editingId || undefined, entry_date: ed, buy_price: $("#tBuy").value,
            stop_price: $("#tStop").value, tp_price: $("#tTp").value } });
  $("#tSave").disabled = true;
  try {
    let r;
    try { r = await post("/api/trades", mk({})); }
    catch (e) {
      if (e.status !== 409) throw e;
      // 同标的 + 同开仓时间撞车：问覆盖；选"否" → 载入库里那条改成「修改」
      const ex = e.body.existing;
      if (window.confirm(`${e.body.msg}（开仓 ${fmt(ex.buy_price)} / 止损 ${fmt(ex.stop_price)} / `
                        + `止盈 ${fmt(ex.tp_price)}）\n\n确定 = 覆盖它\n取消 = 载入它来修改`)){
        r = await post("/api/trades", mk({ overwrite:true }));
      } else { setEditing(ex); return toast("已载入库中记录，改完点「修改」", true); }
    }
    editingId = r.id;
    $("#tSave").textContent = "修改";
    $("#tTitle").textContent = "修改交易";
    toast(`已${r._action==="update"?"更新":"保存"}：开仓 ${fmt(r.buy_price)} × ${r.shares} 股 · `
          + (r.exit_date ? `${r.exit_reason} ${fmt(r.exit_price)} @ ${r.exit_date}` : "持仓中"));
    renderOverlays();
  } catch (e) {
    toast((e.body && e.body.err) || e.message, false);
  } finally { $("#tSave").disabled = false; }
};
$("#tNew").onclick = newTrade;
const toggle = (el, on) => { const d=$(el), v = on===undefined ? d.style.display!=="block" : on;
  d.style.display = v ? "block" : "none"; return v; };
$("#openTrade").onclick = () => { const on = toggle("#panel");
  if (on){ toggle("#setPanel", false); toggle("#notePanel", false); previewTrade(); } };
$("#tClose").onclick = () => toggle("#panel", false);
$("#openSet").onclick = () => { const on = toggle("#setPanel");
  if (on){ toggle("#panel", false); toggle("#notePanel", false);
    $("#sSymName").textContent = `${symbol} ${symName}`; } };
$("#sClose").onclick = () => toggle("#setPanel", false);

// ── 交易心得面板（必填：佐证标的 + 开仓日期 + 内容）──
let noteId = null, noteSym = symbol, nSymTimer;
async function refreshNoteDates(){
  const box = $("#nDates");
  try {
    const ts = await api(`/api/trades?symbol=${noteSym}`);
    if (!ts.length){
      box.innerHTML = `<span style="cursor:default">该标的还没有交易记录 —— 日期可直接填，或先提交那笔交易</span>`;
      return;
    }
    // 最近的开仓日排前面（常见用法就是"刚记完这笔，顺手写心得"）
    ts.sort((a, b) => (a.entry_date < b.entry_date ? 1 : -1));
    box.innerHTML = ts.map(t => `<span data-d="${t.entry_date}">${t.entry_date} @${fmt(t.buy_price)}</span>`).join("");
    box.querySelectorAll("[data-d]").forEach(s => s.onclick = () => $("#nDate").value = s.dataset.d);
  } catch(_) { box.innerHTML = ""; }
}
function newNote(){
  noteId = null;
  $("#nTitle").textContent = "写交易心得";
  $("#nSave").textContent = "保存";
  noteSym = symbol;
  $("#nSym").value = `${symbol} ${symName}`;
  $("#nTitleIn").value = ""; $("#nContent").value = ""; $("#nDate").value = "";
  refreshNoteDates().then(() => {
    if (!$("#nDate").value){
      const f = $("#nDates").querySelector("[data-d]");
      if (f) $("#nDate").value = f.dataset.d;      // 默认选最近一笔开仓日
    }
  });
}
function editNote(n){
  noteId = n.id;
  $("#nTitle").textContent = "修改心得";
  $("#nSave").textContent = "修改";
  noteSym = n.symbol;
  $("#nSym").value = `${n.symbol} ${n.name || ""}`.trim();
  $("#nDate").value = n.entry_date;
  $("#nTitleIn").value = n.title || "";
  $("#nContent").value = n.content || "";
  refreshNoteDates();
}
$("#nSave").onclick = async () => {
  const d = $("#nDate").value, c = $("#nContent").value.trim();
  if (!noteSym) return toast("佐证标的必填", false);
  if (!d) return toast("开仓日期必填", false);
  if (!c) return toast("心得内容必填", false);
  try {
    const r = await post("/api/notes", { note: { id: noteId || undefined, symbol: noteSym,
      entry_date: d, title: $("#nTitleIn").value, content: c } });
    noteId = r.id;
    $("#nTitle").textContent = "修改心得";
    $("#nSave").textContent = "修改";
    toast(`已${r._action === "update" ? "更新" : "保存"}心得：${r.title || c.slice(0, 12) + "…"}`);
  } catch (e) { toast((e.body && e.body.err) || e.message, false); }
};
$("#nNew").onclick = newNote;
$("#openNote").onclick = () => { const on = toggle("#notePanel");
  if (on){ toggle("#panel", false); toggle("#setPanel", false); newNote(); } };
$("#nClose").onclick = () => toggle("#notePanel", false);
$("#nSym").oninput = () => {
  clearTimeout(nSymTimer);
  nSymTimer = setTimeout(async () => {
    const q = $("#nSym").value.trim();
    const box = $("#nSymPop");
    if (!q) return box.style.display = "none";
    const r = await api(`/api/symbols?q=${encodeURIComponent(q)}`);
    box.innerHTML = r.map(x => `<div data-s="${x.symbol}" data-n="${x.name}">${x.symbol} ${x.name}</div>`).join("");
    box.style.display = r.length ? "block" : "none";
    box.querySelectorAll("div").forEach(el => el.onclick = () => {
      noteSym = el.dataset.s;
      $("#nSym").value = `${el.dataset.s} ${el.dataset.n}`;
      box.style.display = "none";
      $("#nDate").value = "";
      refreshNoteDates();
    });
  }, 250);
};
$("#nSym").onblur = () => setTimeout(() => $("#nSymPop").style.display = "none", 180);
$("#openStats").onclick = () => window.open(`trades.html?symbol=${encodeURIComponent(symbol)}`, "_blank");

// ── 设置：显示开关 / 全局止损额度 / 清除当前标的 ──
async function saveSettings(patch){
  try { settings = await post("/api/settings", patch); renderOverlays();
        $("#sRisk").value = settings.risk_amount; previewTrade(); }
  catch (e) { toast("设置保存失败：" + e.message, false); }
}
$("#sLines").onchange  = e => saveSettings({ show_lines:  e.target.checked });
$("#sTrades").onchange = e => saveSettings({ show_trades: e.target.checked });
$("#sRisk").onchange   = e => saveSettings({ risk_amount: e.target.value });
$("#sClear").onclick = async () => {
  if (!window.confirm(`确定清除 ${symbol} ${symName} 的**全部**交易记录？\n不可恢复。`)) return;
  if (!window.confirm(`再确认一次：删除 ${symbol} 的所有交易记录（其他标的保留）。`)) return;
  try {
    const r = await fetch(`/api/trades?symbol=${symbol}&all=1`, {method:"DELETE"}).then(x=>x.json());
    toast(`已清除 ${symbol} 的 ${r.removed} 条交易记录`);
    newTrade(); renderOverlays();
  } catch (e) { toast("清除失败：" + e.message, false); }
};

// ── 5.1 交易录入（旧字段已并入上方面板）──
// ── 6.1 标的搜索 ──
let symTimer;
$("#sym").oninput = () => {
  clearTimeout(symTimer);
  symTimer = setTimeout(async () => {
    const q = $("#sym").value.trim(); if (!q) return $("#symList").style.display="none";
    const r = await api(`/api/symbols?q=${encodeURIComponent(q)}`);
    const box = $("#symList");
    box.innerHTML = r.map(s=>`<div data-s="${s.symbol}" data-n="${s.name}">${s.symbol} ${s.name} (${s.bars})</div>`).join("");
    box.style.display = r.length ? "block" : "none";
    box.querySelectorAll("div").forEach(d => d.onclick = () => {
      symbol = d.dataset.s; symName = d.dataset.n;
      $("#sym").value = `${symbol} ${symName}`; box.style.display="none"; loadAll();
    });
  }, 250);
};
$("#load").onclick = async () => {
  // 解析输入框：支持 "601318.SH 中国平安" / "601318.SH" / "中国平安" 三种写法
  const v = $("#sym").value.trim();
  if (!v) return toast("请输入代码或名称", false);
  const m = v.match(/^(\d{6}\.(SZ|SH|BJ))\s*(.*)$/);
  if (m) {
    symbol = m[1];
    symName = m[3] || symName;
  } else if (v !== `${symbol} ${symName}` && v !== symbol) {
    const r = await api(`/api/symbols?q=${encodeURIComponent(v)}`);
    if (!r.length) return toast(`本地仓库无「${v}」（覆盖：沪深300∪中证500 共 1578 只）`, false);
    symbol = r[0].symbol; symName = r[0].name;
    $("#sym").value = `${symbol} ${symName}`;
  }
  loadAll();
};




loadSettings().then(() => { initChart(); loadAll(); });
