[project]
name = "filter-machine-learning"
version = "0.1.0"
description = "滤波/机器学习方法 skill（骨架，功能待定）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly>=6.9.0",
    "scipy",
    "torch>=2.0",
]

# 注：暂无 [build-system] —— scripts/ 为空，作为 uv 虚拟项目只管理依赖、不打包。
# 待有实现代码后，可加 hatchling build-system + packages = ["scripts"]。

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108", "B028"]
